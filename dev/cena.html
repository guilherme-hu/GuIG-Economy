<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Vitrine da cena — GuIG Economy</title>
    <style>
      html, body { margin: 0; height: 100%; overflow: hidden; background: #000; font: 13px system-ui, sans-serif; }
      canvas { display: block; width: 100%; height: 100%; }
      #painel {
        position: fixed; top: 12px; left: 12px; display: flex; gap: 10px; align-items: center;
        padding: 8px 12px; border-radius: 10px; background: rgb(12 14 24 / 70%); color: #e8ecff;
      }
      #painel input { width: 240px; }
      #painel button { font: inherit; padding: 4px 10px; border-radius: 6px; border: 0; cursor: pointer; }
      #fps { min-width: 150px; font-variant-numeric: tabular-nums; }
    </style>
  </head>
  <body>
    <canvas id="cena"></canvas>
    <div id="painel">
      <label for="hora">Hora</label>
      <input id="hora" type="range" min="0" max="1" step="0.001" value="0" />
      <output id="valor">0.00</output>
      <button id="auto" type="button">auto</button>
      <span id="fps"></span>
    </div>
    <script type="module" src="./cena.js"></script>
  </body>
</html>
